<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>門市操作教學｜故障排除</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen">

  <div id="app" class="max-w-4xl mx-auto p-4 pb-20">

    <!-- 門市 / 管理者身份確認遮罩 -->
    <div v-if="!currentStore" class="fixed inset-0 bg-slate-900/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
      <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl border">
        <div class="text-center mb-6">
          <div class="w-12 h-12 bg-indigo-100 text-indigo-600 rounded-full flex items-center justify-center mx-auto mb-3 text-xl">
            <i class="fa-solid fa-store"></i>
          </div>
          <h2 class="text-lg font-bold text-slate-800">歡迎使用門市後援站</h2>
          <p class="text-xs text-slate-500 mt-1">請輸入您的門市名稱與名字</p>
        </div>
        <div class="space-y-4">
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1">門市名稱</label>
            <input v-model="loginForm.storeName" type="text" placeholder="例：台南南區概念店" class="w-full p-2.5 rounded-lg border border-slate-300 text-sm focus:ring-2 focus:ring-indigo-500 outline-none bg-white">
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1">您的名字</label>
            <input v-model="loginForm.reporter" type="text" placeholder="例：陳店長" class="w-full p-2.5 rounded-lg border border-slate-300 text-sm focus:ring-2 focus:ring-indigo-500 outline-none bg-white">
          </div>
          <p v-if="loginError && !showAdminLogin" class="text-xs text-rose-500 font-bold text-center">{{ loginErrorMessage }}</p>
          <button @click="loginStore" type="button" class="w-full bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 text-white font-bold py-3 rounded-lg shadow transition flex justify-center items-center gap-2 cursor-pointer">
            一般門市登入 <i class="fa-solid fa-arrow-right"></i>
          </button>

          <div class="pt-3 border-t border-slate-200">
            <button @click="showAdminLogin = !showAdminLogin; loginError = false; loginErrorMessage = ''; loginForm.adminPassword = ''" type="button" class="w-full text-xs text-slate-500 hover:text-indigo-600 py-2 transition cursor-pointer">
              <i class="fa-solid fa-user-shield mr-1"></i>
              {{ showAdminLogin ? '收起管理者登入' : '管理者登入入口' }}
            </button>

            <div v-if="showAdminLogin" class="mt-2 p-3 rounded-lg bg-amber-50 border border-amber-200 space-y-3">
              <div>
                <h3 class="text-sm font-bold text-amber-900">管理者專用登入</h3>
                <p class="text-[11px] text-amber-800 mt-1">此區僅供管理者使用。一般門市請使用上方「一般門市登入」。</p>
              </div>
              <div>
                <label class="block text-xs font-bold text-slate-600 mb-1">管理者密碼</label>
                <input v-model="loginForm.adminPassword" type="password" autocomplete="current-password" placeholder="輸入管理者專用密碼" @keyup.enter="loginAdmin" class="w-full p-2.5 rounded-lg border border-slate-300 text-sm focus:ring-2 focus:ring-amber-500 outline-none bg-white">
              </div>
              <p v-if="loginError && showAdminLogin" class="text-xs text-rose-600 font-bold">{{ loginErrorMessage }}</p>
              <button @click="loginAdmin" type="button" :disabled="isAdminLoggingIn" class="w-full bg-amber-500 hover:bg-amber-600 disabled:bg-amber-300 disabled:cursor-wait text-white font-bold py-2.5 rounded-lg shadow-sm transition cursor-pointer flex justify-center items-center gap-2">
                <i v-if="isAdminLoggingIn" class="fa-solid fa-spinner fa-spin"></i>
                <i v-else class="fa-solid fa-user-shield"></i>
                {{ isAdminLoggingIn ? '驗證中，載入儀表板…' : '驗證管理者並進入後台' }}
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- 頂部標頭 -->
    <header class="bg-indigo-600 text-white p-4 rounded-xl shadow-md mb-6 flex justify-between items-center">
      <div>
        <h1 class="text-xl font-bold flex items-center gap-2">
          <i class="fa-solid font-bold fa-cash-register"></i> 門市操作教學與故障排除
        </h1>
        <p class="text-xs text-indigo-100 mt-1">
          當前使用者：<span class="font-bold underline">{{ currentStore }}</span> ({{ currentReporter }})
          <span v-if="isAdmin" class="ml-2 bg-amber-400 text-slate-900 font-bold px-2 py-0.5 rounded text-[10px]">
            <i class="fa-solid fa-user-shield"></i> 管理者模式
          </span>
        </p>
      </div>
      <div>
        <button @click="logoutStore" class="bg-indigo-500 hover:bg-indigo-700 text-xs px-3 py-1.5 rounded-lg text-white border border-indigo-400 transition cursor-pointer">
          登出
        </button>
      </div>
    </header>

    <!-- 主功能：兩個分開的按鈕，各自切換到獨立頁面 -->
    <div class="grid grid-cols-2 gap-3 mb-6">
      <button
        type="button"
        @click="activeTab = 'guide'"
        :aria-pressed="activeTab === 'guide'"
        :class="activeTab === 'guide' ? 'border-indigo-500 bg-indigo-50 text-indigo-700 ring-2 ring-indigo-100' : 'border-slate-200 bg-white text-slate-600 hover:border-indigo-300 hover:bg-indigo-50/50'"
        class="min-h-[82px] rounded-xl border-2 px-4 py-3 shadow-sm transition flex flex-col items-center justify-center gap-2 cursor-pointer">
        <i class="fa-solid fa-book-open text-xl"></i>
        <span class="font-bold text-sm">操作教學</span>
      </button>

      <button
        type="button"
        @click="activeTab = 'troubleshooting'"
        :aria-pressed="activeTab === 'troubleshooting'"
        :class="activeTab === 'troubleshooting' ? 'border-rose-500 bg-rose-50 text-rose-700 ring-2 ring-rose-100' : 'border-slate-200 bg-white text-slate-600 hover:border-rose-300 hover:bg-rose-50/50'"
        class="min-h-[82px] rounded-xl border-2 px-4 py-3 shadow-sm transition flex flex-col items-center justify-center gap-2 cursor-pointer">
        <i class="fa-solid fa-screwdriver-wrench text-xl"></i>
        <span class="font-bold text-sm">故障排除</span>
      </button>
    </div>

    <div v-if="isAdmin" class="mb-6">
      <button @click="activeTab = 'dashboard'" :class="activeTab === 'dashboard' ? 'bg-amber-100 text-amber-800 border-amber-300' : 'bg-white text-slate-600 border-slate-200 hover:bg-amber-50'" class="w-full border rounded-lg px-4 py-2.5 text-sm font-bold transition flex justify-center items-center gap-2 cursor-pointer">
        <i class="fa-solid fa-chart-pie"></i> 後台：門市查詢儀表板
      </button>
    </div>

    <!-- 操作教學 -->
    <main v-if="activeTab === 'guide'">
      <div class="relative mb-4 flex gap-2">
        <div class="relative flex-1">
          <i class="fa-solid fa-magnifying-glass absolute left-3 top-3.5 text-slate-400"></i>
          <input v-model="guideSearchQuery" @keyup.enter="handleGuideSearchSubmit" type="text" placeholder="搜尋操作教學（例：更新、子機、停售、清桌、日期）" class="w-full pl-10 pr-4 py-2.5 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white text-sm">
        </div>
        <button @click="handleGuideSearchSubmit" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 rounded-lg text-xs font-bold transition cursor-pointer">搜尋</button>
      </div>

      <div v-if="guideSearchQuery.trim() && filteredGuides.length === 0" class="mb-4 p-3 bg-amber-50 border border-amber-200 rounded-lg text-xs text-amber-700">
        <i class="fa-solid fa-triangle-exclamation"></i> 找不到「<strong>{{ guideSearchQuery }}</strong>」相關的操作教學。
      </div>

      <div class="space-y-3">
        <article v-for="item in filteredGuides" :key="item.id" @click="openGuide(item)" class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm hover:border-indigo-300 transition cursor-pointer">
          <div class="flex justify-between items-start mb-2">
            <span class="text-xs px-2.5 py-0.5 rounded bg-indigo-50 text-indigo-600 font-medium">{{ item.category }}</span>
          </div>
          <h3 class="font-bold text-slate-800 mb-1 text-sm">{{ item.title }}</h3>
          <p class="text-xs text-slate-500 line-clamp-2">{{ item.summary }}</p>
        </article>
      </div>
    </main>

    <!-- 故障排除 -->
    <main v-if="activeTab === 'troubleshooting'">
      <div class="relative mb-4 flex gap-2">
        <div class="relative flex-1">
          <i class="fa-solid fa-magnifying-glass absolute left-3 top-3.5 text-slate-400"></i>
          <input v-model="searchQuery" @keyup.enter="handleSearchSubmit" type="text" placeholder="輸入關鍵字（例：小白單、斷線、退單）並可按 Enter 記錄..." class="w-full pl-10 pr-4 py-2.5 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white text-sm">
        </div>
        <button @click="handleSearchSubmit" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 rounded-lg text-xs font-bold transition cursor-pointer">
          搜尋
        </button>
      </div>

      <div v-if="searchQuery.trim() && filteredFaqs.length
